blueprint:
  name: Induction hob — ventilation and lights
  description: >-
    Follow the input_select tracked-level helper from the induction hob
    power-level blueprint. Select four scripts: a lights toggle, a motor
    toggle, a motor power increase, and a motor power decrease.

    Level 0 has lights and motor off. Levels 1 and 2 have lights on and
    the motor at low power. Levels 3 and 4 use medium and high motor power.
    The motor toggle must start the motor at low power.

    Create a dedicated input_select with options 0, 1, 2, 3 for the last
    commanded motor speed (off, low, medium, high), and an input_boolean
    for the last commanded lights state. These must be separate from the
    hob tracked-level helper. Initialize them to 0 and off with both devices
    off. External toggles can put the devices out of sync with these helpers.

    Every hob level change cancels pending delays and recalculates commands
    from the saved motor and lights states. Increases take effect immediately.
    If a decrease is still needed after an increase, its full delay starts
    again. Each motor reduction or motor-off command waits 15 seconds by
    default. Lights turn off after a separate delay of 30 seconds at level 0.
    Both delays are configurable and run independently.

    Jumps across levels run every required motor step, including a direct
    reset to 0. Returning from 0 before the lights-off delay expires keeps
    the lights on. Unknown, unavailable, and attribute-only changes are ignored.
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    tracked_level:
      name: Hob tracked level helper
      description: The input_select used by the hob blueprint, with options 0–4.
      selector:
        entity:
          filter:
            - domain: input_select
    motor_level:
      name: Commanded motor speed helper
      description: Dedicated input_select with options 0, 1, 2, 3; initialize to 0.
      selector:
        entity:
          filter:
            - domain: input_select
    lights_active:
      name: Commanded lights state helper
      description: Dedicated input_boolean; initialize to off with the lights off.
      selector:
        entity:
          filter:
            - domain: input_boolean
    lights_toggle_script:
      name: Lights on/off script
      description: Script that toggles the ventilator lights on or off.
      selector:
        entity:
          filter:
            - domain: script
    motor_toggle_script:
      name: Motor on/off script
      description: Script that toggles the motor; turning it on must select low power.
      selector:
        entity:
          filter:
            - domain: script
    increase_power_script:
      name: Increase motor power script
      description: Script that increases the motor power by one step.
      selector:
        entity:
          filter:
            - domain: script
    decrease_power_script:
      name: Decrease motor power script
      description: Script that decreases the motor power by one step.
      selector:
        entity:
          filter:
            - domain: script
    lights_off_delay_seconds:
      name: Lights-off delay
      default: 30
      selector:
        number:
          min: 0
          max: 600
          step: 1
          unit_of_measurement: s
          mode: box
    power_decrease_delay_seconds:
      name: Motor power decrease delay
      description: Delay before each power decrease or motor-off command.
      default: 15
      selector:
        number:
          min: 0
          max: 600
          step: 1
          unit_of_measurement: s
          mode: box

mode: restart

triggers:
  - trigger: state
    entity_id: !input tracked_level
    to: null

conditions:
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none and trigger.to_state is not none
         and trigger.from_state.state in ['0', '1', '2', '3', '4']
         and trigger.to_state.state in ['0', '1', '2', '3', '4']
         and trigger.from_state.state != trigger.to_state.state }}

actions:
  - variables:
      motor_level_entity: !input motor_level
      lights_active_entity: !input lights_active
      hob_level_entity: !input tracked_level
      new_level: "{{ trigger.to_state.state | int }}"
      target_motor_level: "{{ [new_level - 1, 1] | max if new_level > 0 else 0 }}"
  - parallel:
      - sequence:
          - repeat:
              while:
                - condition: template
                  value_template: >-
                    {{ states(hob_level_entity) in ['0', '1', '2', '3', '4']
                       and states(motor_level_entity) in ['0', '1', '2', '3']
                       and states(motor_level_entity) | int != target_motor_level }}
              sequence:
                - variables:
                    current_motor_level: "{{ states(motor_level_entity) | int }}"
                - choose:
                    - conditions:
                        - condition: template
                          value_template: "{{ current_motor_level < target_motor_level }}"
                      sequence:
                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ current_motor_level == 0 }}"
                              sequence:
                                - action: !input motor_toggle_script
                          default:
                            - action: !input increase_power_script
                        - action: input_select.select_option
                          target:
                            entity_id: "{{ motor_level_entity }}"
                          data:
                            option: "{{ current_motor_level + 1 }}"
                  default:
                    - delay:
                        seconds: !input power_decrease_delay_seconds
                    - condition: template
                      value_template: >-
                        {{ states(hob_level_entity) in ['0', '1', '2', '3', '4']
                           and states(hob_level_entity) | int == new_level }}
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ current_motor_level > 1 }}"
                          sequence:
                            - action: !input decrease_power_script
                      default:
                        - action: !input motor_toggle_script
                    - action: input_select.select_option
                      target:
                        entity_id: "{{ motor_level_entity }}"
                      data:
                        option: "{{ current_motor_level - 1 }}"
      - sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ new_level > 0 }}"
                  - condition: state
                    entity_id: !input lights_active
                    state: "off"
                sequence:
                  - action: !input lights_toggle_script
                  - action: input_boolean.turn_on
                    target:
                      entity_id: "{{ lights_active_entity }}"
              - conditions:
                  - condition: template
                    value_template: "{{ new_level == 0 }}"
                  - condition: state
                    entity_id: !input lights_active
                    state: "on"
                sequence:
                  - delay:
                      seconds: !input lights_off_delay_seconds
                  - condition: state
                    entity_id: !input tracked_level
                    state: "0"
                  - action: !input lights_toggle_script
                  - action: input_boolean.turn_off
                    target:
                      entity_id: "{{ lights_active_entity }}"
